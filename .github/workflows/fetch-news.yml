# ⚠️  LIMITAÇÃO DO GITHUB ACTIONS — LEIA ANTES DE ALTERAR
# Workflows agendados (schedule/cron) são DESATIVADOS AUTOMATICAMENTE
# pelo GitHub após 60 dias sem commits no repositório.
# Se as notícias pararem de atualizar, verifique primeiro se o workflow
# foi desativado em: GitHub → Actions → (este workflow) → Enable workflow.
# Solução permanente: faça pelo menos 1 commit a cada 60 dias, ou use
# um repositório externo (ex: cron-job.org) para fazer workflow_dispatch
# via API do GitHub como keep-alive.
# Ref: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/disabling-and-enabling-a-workflow
name: Fetch News Feed

on:
  schedule:
    # Notícias: de hora em hora (conteúdo não muda tanto)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install rss-parser @supabase/supabase-js @vitalets/google-translate-api

      - name: Run Fetch Script (Notícias)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch_news.js
